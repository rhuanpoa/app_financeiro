<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#f4f3ee">
<meta name="description" content="Controle de finanças pessoais: saldo, gastos, parcelas, metas e previsão de 12 meses.">

<title>Minhas Finanças</title>

<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Finanças">
<meta name="mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/style.css">
</head>
<body>

<!-- Conteúdo da tela atual, montado por js/screens.js -->
<main id="view" class="view"></main>

<!-- Aviso flutuante -->
<div id="toast" class="toast" hidden></div>

<!-- Barra de navegação fixa -->
<nav class="tabbar">
  <button class="tab" data-nav="dash" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h14V9.5"/></svg>
    <span>Início</span>
  </button>
  <button class="tab" data-nav="proj" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V11M10 20V4M16 20v-6M22 20H2"/></svg>
    <span>Previsão</span>
  </button>
  <div class="tab-fab-slot">
    <button class="fab" data-action="add-out" type="button" aria-label="Novo lançamento">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </div>
  <button class="tab" data-nav="parcelas" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M12 3 3 8l9 5 9-5-9-5Z"/><path d="M3 13l9 5 9-5"/></svg>
    <span>Parcelas</span>
  </button>
  <button class="tab" data-nav="mais" type="button">
    <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
    <span>Mais</span>
  </button>
</nav>

<script src="./js/store.js"></script>
<script src="./js/calc.js"></script>
<script src="./js/screens.js"></script>
<script src="./js/app.js"></script>
</body>
</html>
