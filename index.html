<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#f4f3ee">
<meta name="description" content="Controle de finanças pessoais: saldo, gastos, parcelas, metas, importação de extrato e previsão de 12 meses.">

<title>Minhas Finanças</title>

<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Finanças">
<meta name="mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/style.css">
</head>
<body>

<!-- Conteúdo da tela atual, montado por js/screens.js -->
<main id="view" class="view"></main>

<!-- Barra de navegação fixa -->
<nav class="tabbar">
  <button class="tab" data-nav="dash" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h14V9.5"/></svg>
    <span>Início</span>
  </button>
  <button class="tab" data-nav="proj" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V11M10 20V4M16 20v-6M22 20H2"/></svg>
    <span>Previsão</span>
  </button>
  <div class="tab-fab-slot">
    <button class="fab" data-action="add-out" type="button" aria-label="Novo lançamento">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </div>
  <button class="tab" data-nav="movimentacoes" type="button">
    <span class="tab-ico">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h13l-3-3M20 16H7l3 3"/></svg>
      <em class="tab-badge" id="tab-badge" hidden></em>
    </span>
    <!-- "Movimentações" não cabe em 1/5 da tela de um celular sem ser
         cortado; o menu lateral usa o nome inteiro. -->
    <span>Extrato</span>
  </button>
  <button class="tab" data-action="abrir-menu" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    <span>Menu</span>
  </button>
</nav>

<!-- Aviso flutuante -->
<div id="toast" class="toast" hidden></div>

<!-- Menu lateral -->
<div id="overlay" class="drawer-overlay" hidden></div>

<aside id="drawer" class="drawer" hidden aria-label="Menu">
  <div class="drawer-head">
    <div class="drawer-brand">Minhas Finanças</div>
    <div class="drawer-saldo mono" id="drawer-saldo">R$ 0,00</div>
  </div>

  <nav class="drawer-nav">
    <button class="drawer-item" data-nav="dash" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h14V9.5"/></svg>
      <span>Início</span>
    </button>
    <button class="drawer-item" data-nav="movimentacoes" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h13l-3-3M20 16H7l3 3"/></svg>
      <span>Movimentações</span>
      <em class="drawer-badge" id="drawer-badge" hidden></em>
    </button>
    <button class="drawer-item" data-nav="proj" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V11M10 20V4M16 20v-6M22 20H2"/></svg>
      <span>Previsão</span>
    </button>
    <button class="drawer-item" data-nav="hist" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      <span>Histórico</span>
    </button>
    <button class="drawer-item" data-nav="categorias" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v8.5l6 3" stroke-linecap="round"/></svg>
      <span>Categorias</span>
    </button>
    <button class="drawer-item" data-nav="metas" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3.5"/></svg>
      <span>Metas</span>
    </button>
    <button class="drawer-item" data-nav="parcelas" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3 3 8l9 5 9-5-9-5Z"/><path d="M3 13l9 5 9-5" stroke-linecap="round"/></svg>
      <span>Parcelas</span>
    </button>

    <div class="drawer-sep"></div>

    <button class="drawer-item" data-nav="importar" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M4 20h16"/></svg>
      <span>Importar extrato</span>
    </button>
    <button class="drawer-item" data-action="exportar" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M7 8l5-5 5 5"/><path d="M4 20h16"/></svg>
      <span>Exportar backup</span>
    </button>
    <button class="drawer-item" data-action="importar-backup" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 3v5h-5"/></svg>
      <span>Restaurar backup</span>
    </button>
    <button class="drawer-item danger" data-action="clear-all" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 7h14M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>
      <span>Apagar todos os dados</span>
    </button>
  </nav>

  <div class="drawer-foot">
    <div class="versao-linha">
      <span>Versão <b id="versao-app">—</b></span>
      <button id="btn-atualizar" data-action="buscar-atualizacao" type="button">Buscar atualização</button>
    </div>
    <div id="versao-status" class="versao-status" hidden></div>
    <div class="drawer-nota">Seus dados ficam salvos só neste aparelho.</div>
  </div>
</aside>

<script src="./js/store.js"></script>
<script src="./js/calc.js"></script>
<script src="./js/importar.js"></script>
<script src="./js/screens.js"></script>
<script src="./js/app.js"></script>
</body>
</html>
